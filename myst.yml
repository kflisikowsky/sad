  extra_html_head: |
    <script>
    const originalTextContent = Object.getOwnPropertyDescriptor(Node.prototype, 'textContent');
    Object.defineProperty(Node.prototype, 'textContent', {
      ...originalTextContent,
      set(value) {
        if (value === 'CONTENTS') {
          value = 'SPIS TREŚCI';
        }
        originalTextContent.set.call(this, value);
      }
    });
    </script>
